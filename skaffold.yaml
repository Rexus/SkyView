apiVersion: skaffold/v4beta13
kind: Config
metadata:
  name: skyview
build:
  artifacts:
    - image: registry.example.com/library/skyview
      custom:
        buildCommand: ./scripts/build-image.sh
        dependencies:
          paths:
            - "**/*.go"
            - go.mod
            - "web/**"
            - "internal/server/dist/**"
            - Dockerfile
  local:
    # The custom builder pushes with Skopeo using HARBOR_USER/HARBOR_PASSWORD.
    # The cluster pulls the resulting image from the registry.
    push: true
manifests:
  kustomize:
    paths:
      - kubernetes
deploy:
  kubectl: {}
  statusCheckDeadlineSeconds: 180
