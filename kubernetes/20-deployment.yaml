apiVersion: apps/v1
kind: Deployment
metadata:
  name: skyview
  namespace: skyview
  labels:
    app.kubernetes.io/name: skyview
    app.kubernetes.io/component: web
spec:
  # The workspace is a ReadWriteOnce volume; one replica, Recreate on upgrade.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: skyview
  template:
    metadata:
      labels:
        app.kubernetes.io/name: skyview
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: skyview
          image: registry.example.com/library/skyview
          imagePullPolicy: IfNotPresent
          env:
            - name: SKYVIEW_ADDR
              value: 0.0.0.0:8080
            - name: SKYVIEW_WORKSPACE
              value: /data
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: workspace
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: skyview-workspace
        - name: tmp
          emptyDir: {}
      terminationGracePeriodSeconds: 15
