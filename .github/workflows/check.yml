name: Check and build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: go test -timeout 90s ./cmd/... ./internal/... ./examples/...
      - run: go vet ./cmd/... ./internal/... ./examples/...
      - run: go build -o bin/skyview ./cmd/skyview

  pendulum:
    runs-on: ubuntu-latest
    container: python:3.12-slim
    steps:
      - uses: actions/checkout@v7
      - run: python -m pip install -r scripts/pendulum/requirements.txt
      - run: python scripts/pendulum/run.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pendulum-results
          path: bin/pendulum-results/
          retention-days: 7
