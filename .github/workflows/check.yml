name: Check and build

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
  workflow_call:
    inputs:
      revision:
        type: string
        description: Full release commit to check

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.revision || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: go test -timeout 90s . ./cmd/... ./internal/... ./examples/...
      - run: go vet . ./cmd/... ./internal/... ./examples/...
      - run: go build -o bin/skyview ./cmd/skyview
      - name: Test release automation when present in this revision
        run: |
          if [[ -f deployment/release/test_release.py ]]; then
            python3 -B deployment/release/test_release.py
          else
            echo 'This revision predates the automatic versioning tests'
          fi

  pendulum:
    runs-on: ubuntu-latest
    container: python:3.12-slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.revision || github.sha }}
          persist-credentials: false
      - run: python -m pip install -r examples/inverted-pendulum/simulation/requirements.txt
      - run: python examples/inverted-pendulum/simulation/run.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: pendulum-results
          path: bin/pendulum-results/
          retention-days: 7

  sysml:
    runs-on: ubuntu-latest
    container: eclipse-temurin:21-jdk-jammy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.revision || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod
          cache: false
      - run: go run ./cmd/skyview standards-setup -report bin/sysml-validation/setup.json
      - run: SKYVIEW_NATIVE_TESTS=1 go test -timeout 300s ./internal/standards
      - run: go run ./cmd/skyview lint -repository -timeout 5m -report bin/sysml-validation/latest.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: sysml-validation
          path: bin/sysml-validation/
          retention-days: 7
