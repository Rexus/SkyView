name: Report a bug
description: Report a problem you hit while using SkyView.
labels: [bug]
body:
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Describe the problem and what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: How can we reproduce it?
      description: Include the steps and a small SysML example if it helps. Remove credentials and private model data.
    validations:
      required: true
  - type: textarea
    id: build
    attributes:
      label: Version or build report
      description: Select the version in SkyView's footer and choose Copy build report. Review the report before sharing it.
