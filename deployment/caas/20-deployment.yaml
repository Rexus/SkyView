apiVersion: apps/v1
kind: Deployment
metadata:
  name: skyview
  namespace: skyview
  labels:
    app.kubernetes.io/name: skyview
    app.kubernetes.io/component: web
spec:
  # The workspace is a ReadWriteOnce volume; one replica, Recreate on upgrade.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: skyview
  template:
    metadata:
      labels:
        app.kubernetes.io/name: skyview
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: skyview
          image: registry.example.com/library/skyview
          imagePullPolicy: IfNotPresent
          env:
            - name: SKYVIEW_ADDR
              value: 0.0.0.0:8080
            - name: SKYVIEW_WORKSPACE
              value: /data
            - name: SKYVIEW_MODE
              value: multi-user
            - name: SKYVIEW_PUBLIC_URL
              value: https://skyview.example.com
            - name: SKYVIEW_ACCOUNTS_FILE
              value: /run/skyview/accounts.json
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1536Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: workspace
              mountPath: /data
            - name: accounts
              mountPath: /run/skyview
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: skyview-workspace
        - name: accounts
          secret:
            secretName: skyview-accounts
            defaultMode: 0440
        - name: tmp
          emptyDir: {}
      terminationGracePeriodSeconds: 135
